<!-- Source image for every generated PWA / apple-touch icon (see vite.config.ts
     pwaAssets). A pictograph drum — the same Lucide "drum" geometry the in-app
     Pictograph component and scorekeeper's ICON_DRUM draw — in white on the
     brand red (#A1000A, the manifest theme_color). Full-bleed square with no
     self-drawn rounded corners or border: the OS applies its own corner mask
     on top, and a second rounding underneath it clips unevenly. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#A1000A" />
  <g
    transform="translate(96 104) scale(13.33)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.7"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M2 9v8a10 5 0 0 0 20 0V9" />
    <ellipse cx="12" cy="9" rx="10" ry="5" />
    <path d="m2 2 6 6" />
    <path d="m22 2-6 6" />
  </g>
</svg>
